  <text x="175" y="28" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" letter-spacing="0.1em" fill="#A62626">M</text>
  <text x="62.5" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.26em" fill="#9C928C">STORIES CRAFTED BY HAND</text>
  
  <line x1="62.5" y1="46" x2="225" y2="46" stroke="#A62626" stroke-width="0.75" stroke-opacity="0.4"/>
