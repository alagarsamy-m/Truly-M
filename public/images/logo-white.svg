    <rect x="2" y="2" width="40" height="40" rx="20" stroke="#4A443E" stroke-width="1.2" fill="#2E2925"/>
    <rect x="5" y="5" width="34" height="34" rx="17" stroke="#A62626" stroke-width="0.8" stroke-dasharray="2.5 1.5" fill="none" opacity="0.9"/>
    
    <!-- Shuttle / Weaving Needle Silhouette -->
    <path d="M12 22C12 22 17 12 22 12C27 12 32 22 32 22C32 22 27 32 22 32C17 32 12 22 12 22Z" fill="#3D3631" stroke="#8C7E72" stroke-width="0.8"/>
    <ellipse cx="22" cy="22" rx="3" ry="1.5" fill="#A62626"/>

